# WHEELTEC G60 (ATGM336H-5N, NMEA0183). Factory baud = 9600; after a factory reset
# in GnssToolKit the module switches to 115200 (see vendor manual, section 2.2).
nmea_navsat_driver:
  ros__parameters:
    port: "/dev/wheeltec_gps"
    baud: 9600
    frame_id: "gps_link"
    time_ref_source: "gps"
    useRMC: false
